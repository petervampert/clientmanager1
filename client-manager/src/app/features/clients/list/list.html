<div class="page-container">
  <div class="page-header">
    <h1>Clients</h1>
    <div class="header-actions">
      <button mat-stroked-button (click)="downloadPdf()" [disabled]="downloadingPdf()">
        @if (downloadingPdf()) {
          <mat-spinner diameter="18" class="inline-spinner"></mat-spinner>
        } @else {
          <mat-icon>picture_as_pdf</mat-icon>
        }
        Export PDF
      </button>
      <button mat-raised-button color="primary" routerLink="/clients/new">
        <mat-icon>add</mat-icon> New Client
      </button>
    </div>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search clients</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Name, email or phone…" />
    <mat-icon matPrefix>search</mat-icon>
    @if (searchControl.value) {
      <button mat-icon-button matSuffix (click)="searchControl.setValue('')" aria-label="Clear">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <div class="table-wrapper mat-elevation-z2">
      <table mat-table [dataSource]="clients()" class="full-width">

        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let c">{{ c.id }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let c">{{ c.firstName }} {{ c.lastName }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let c">{{ c.email }}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let c">{{ c.phone || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Registered</th>
          <td mat-cell *matCellDef="let c">{{ c.createdAt | date:'dd/MM/yyyy' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let c">
            <button mat-icon-button [routerLink]="['/clients', c.id]" matTooltip="View">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button color="primary" [routerLink]="['/clients', c.id, 'edit']" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteClient(c)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
            No clients found.
          </td>
        </tr>
      </table>

      <mat-paginator
        [length]="totalCount()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPageChange($event)"
        aria-label="Select page">
      </mat-paginator>
    </div>
  }
</div>
